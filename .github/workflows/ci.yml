name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_BASE_URL: /api

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Bhasha-Salahakar-Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Bhasha-Salahakar-Backend/package-lock.json
      - run: npm ci
      - run: node -e "require('./src/config/env')"
        env:
          JWT_SECRET: test-secret
          SARVAM_API_KEY: test-key
